name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: ~/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: npx turbo run test --parallel

      - run: npx turbo run build --parallel

      # Optional: upload build artifacts
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/dist
            **/build
            **/out
          retention-days: 7