name: CI

# define global environment variables
env:
  # Optional: you can set a default node version or other vars here
  NODE_VERSION: 'lts/*'

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  setup-test-build:
    name: Setup, Test, and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          echo "Current directory: $(pwd)"
          echo "Files in root:"
          ls -la
          echo "package-lock.json details:"
          ls -la package-lock.json
          echo "package-lock.json content (first 10 lines):"
          head -10 package-lock.json
          echo "npm version: $(npm --version)"
          echo "Node version: $(node --version)"
          npm ci --verbose

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: ~/.turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run tests
        run: npx turbo run test --parallel

      - name: Build applications
        run: npx turbo run build --parallel

      # Optional: upload build artifacts
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/dist
            **/build
            **/out
          retention-days: 7